<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · HPERD CMS</title>
<link rel="icon" type="image/jpeg" href="../assets/images/hperd-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy:'#0F2D52', 'navy-deep':'#0A1F3A', teal:'#0F766E', gold:'#D4A017', mist:'#F2F4F6', paper:'#FBFAF8', ink:'#1A2733', 'ink-soft':'#4B5B68' },
    fontFamily: { display:['Poppins','Inter','sans-serif'], body:['Inter','sans-serif'] }
  }}}
</script>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="font-body bg-mist text-ink antialiased min-h-screen flex items-center justify-center p-5">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img src="../assets/images/hperd-logo.jpg" alt="HPERD" class="w-16 h-16 mx-auto object-contain">
      <h1 class="font-display font-semibold text-navy text-xl mt-4">HPERD Admin CMS</h1>
      <p class="text-ink-soft text-sm mt-1">Sign in to manage the department website</p>
    </div>

    <form id="loginForm" class="bg-white rounded-2xl shadow-lg border border-navy/5 p-7 space-y-4">
      <div>
        <label class="text-sm font-medium text-ink-soft">Email</label>
        <input type="email" id="email" required autocomplete="username"
          class="mt-1.5 w-full rounded-xl border border-navy/15 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gold/60"
          placeholder="you@fmu.edu.pk">
      </div>
      <div>
        <label class="text-sm font-medium text-ink-soft">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
          class="mt-1.5 w-full rounded-xl border border-navy/15 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gold/60"
          placeholder="••••••••">
      </div>
      <p id="loginError" class="text-sm text-red-600 hidden"></p>
      <button type="submit" id="loginBtn"
        class="w-full bg-navy text-white font-medium rounded-xl py-2.5 text-sm hover:bg-navy-deep transition">
        Sign In
      </button>
    </form>

    <p class="text-center text-xs text-ink-soft mt-6">
      No account yet? <a href="signup.html" class="text-teal font-medium hover:underline">Create the first admin account</a>
    </p>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    // If already signed in, skip straight to the dashboard.
    (async () => {
      try {
        await apiCall('/auth/me.php', { auth: false });
        window.location.href = 'index.html';
      } catch {
        // Not signed in — stay on this page. That's the expected case.
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        await apiCall('/auth/login.php', {
          method: 'POST',
          auth: false,
          body: {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          },
        });
        window.location.href = 'index.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Sign-in failed — check your email and password.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
